# GitHub REST API tools over outgoing HTTPS (`api.github.com`) with a fine-grained token.
id = "kumikit.github"
name = "GitHub"
version = "0.1.1"
description = "Read and create GitHub pull requests, issues and commit checks over the GitHub REST API."
license = "MIT"
repository = "https://github.com/kumikit/kumikit-plugin-github"
kind = ["tool"]
api = "^0.2"

[runtime]
wasm = "plugin.wasm"
worlds = ["kumikit:tool/plugin@0.1.0"]

[permissions]
network = ["api.github.com"]
secrets = ["github-token"]

[contributes]
settings = "settings.schema.json"

[[contributes.tools]]
name = "pull_request_get"
title = "Get pull request"
description = "Fetch one GitHub pull request by repository and number."
input = "tools/pull_request_get.schema.json"
effect = "read"

[[contributes.tools]]
name = "pull_requests_list"
title = "List pull requests"
description = "List pull requests in a GitHub repository."
input = "tools/pull_requests_list.schema.json"
effect = "read"

[[contributes.tools]]
name = "issue_get"
title = "Get issue"
description = "Fetch one GitHub issue by repository and number."
input = "tools/issue_get.schema.json"
effect = "read"

[[contributes.tools]]
name = "issues_list"
title = "List issues"
description = "List issues in a GitHub repository."
input = "tools/issues_list.schema.json"
effect = "read"

[[contributes.tools]]
name = "checks_for_ref"
title = "Checks for ref"
description = "List GitHub check runs for a commit SHA, branch or tag."
input = "tools/checks_for_ref.schema.json"
effect = "read"

[[contributes.tools]]
name = "create_pull_request"
title = "Create pull request"
description = "Open a new pull request in a GitHub repository."
input = "tools/create_pull_request.schema.json"
effect = "write"

[[contributes.tools]]
name = "create_issue_comment"
title = "Comment on issue or PR"
description = "Post a comment on a GitHub issue or pull request."
input = "tools/create_issue_comment.schema.json"
effect = "write"
